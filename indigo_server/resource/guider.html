<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
		<link rel="stylesheet" href="bootstrap.min.css"/>
		<link rel="stylesheet" href="glyphicons.css"/>
		<link rel="stylesheet" href="indigo.css"/>
	</head>
	<title>INDIGO Guider</title>
	<body class="bg-secondary">
		<div id="ROOT">
			<indigo-navbar active="guider" title="INDIGO Guider" icon="guider.png" expand="md"></indigo-navbar>
			<div class="container-fluid">
				<div v-if="devices['Guider Agent'] == null" class="alert alert-warning alert-dismissible m-1" role="alert">
					Waiting for Guider agent...
				</div>
				<template v-else>
					<div class="row g-0">
						<div class="col-xl-4 indigo-side-panel">
							<template v-if="findProperty('Guider Agent', 'FILTER_CCD_LIST') != null">
								<div class="card p-1 m-1 bg-light">
									<div class="card-body d-flex flex-wrap">
										<indigo-select-item :property="findProperty('Guider Agent', 'FILTER_CCD_LIST')"></indigo-select-item>
										<template v-if="window.guiderCameraSelected()">
											<indigo-select-item :property="findProperty('Guider Agent', 'CCD_MODE')" :cls="'w-50'"></indigo-select-item>
											<indigo-number-dropdown :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'EXPOSURE'" :values="[{ label: 'Exposure 0 s', value: 0 }, { label: 'Exposure 0.1 s', value: 0.1 }, { label: 'Exposure 0.2 s', value: 0.2 }, { label: 'Exposure 0.3 s', value: 0.3 }, { label: 'Exposure 0.5 s', value: 0.5 }, { label: 'Exposure 1 s', value: 1 }, { label: 'Exposure 2 s', value: 2 }, { label: 'Exposure 3 s', value: 3 }, { label: 'Exposure 5 s', value: 5 }, { label: 'Exposure 10 s', value: 10 }]" :tooltip="'Exposure Time'" :cls="'w-50'"></indigo-number-dropdown>
										</template>
									</div>
								</div>
							</template>
							<template v-if="findProperty('Guider Agent', 'FILTER_GUIDER_LIST') != null">
								<div class="card p-1 m-1 mt-2 bg-light">
									<div class="card-body d-flex flex-wrap">
										<indigo-select-item :property="findProperty('Guider Agent', 'FILTER_GUIDER_LIST')"></indigo-select-item>
										<template v-if="window.guiderRateProperty() != null">
											<indigo-edit-number :property="window.guiderRateProperty()" :name="'RATE'" :icon="'glyphicons-resize-horizontal'" :tooltip="'Guiding rate RA'" :cls="'w-50'"></indigo-edit-number>
											<indigo-edit-number :property="window.guiderRateProperty()" :name="window.guiderRateHasDecItem() ? 'DEC_RATE' : 'RATE'" :icon="'glyphicons-resize-vertical'" :tooltip="'Guiding rate Dec'" :cls="'w-50'" :disabled="!window.guiderRateHasDecItem()" :display-value="window.guiderRateHasDecItem() ? null : window.guiderRateValue('RATE')"></indigo-edit-number>
										</template>
									</div>
								</div>
							</template>
							<template v-if="findProperty('Guider Agent', 'AGENT_GUIDER_DETECTION_MODE') != null">
								<div class="card p-1 m-1 mt-2 bg-light">
									<div class="card-body d-flex flex-wrap">
										<indigo-select-item :property="findProperty('Guider Agent', 'AGENT_GUIDER_DETECTION_MODE')" :cls="'w-50'"></indigo-select-item>
										<indigo-number-dropdown v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SELECTION', 'COUNT')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SELECTION')" :name="'COUNT'" :cls="'w-50'" :values="[{ value: 1, icon: 'glyphicons-star', iconCount: 1 }, { value: 2, icon: 'glyphicons-star', iconCount: 2 }, { value: 3, icon: 'glyphicons-star', iconCount: 3 }, { value: 4, icon: 'glyphicons-star', iconCount: 4 }, { value: 5, icon: 'glyphicons-star', iconCount: 5 }, { value: 6, icon: 'glyphicons-star', iconCount: 6 }, { value: 7, icon: 'glyphicons-star', iconCount: 7 }, { value: 8, icon: 'glyphicons-star', iconCount: 8 }]" :disabled="!(window.guiderDetectionModeIs('SELECTION') || window.guiderDetectionModeIs('WEIGHTED_SELECTION'))" :display-value="window.guiderDetectionModeIs('SELECTION') || window.guiderDetectionModeIs('WEIGHTED_SELECTION') ? null : 1" :tooltip="'Maximum number of stars'"></indigo-number-dropdown>
										<template v-if="window.guiderDetectionModeIs('SELECTION') || window.guiderDetectionModeIs('WEIGHTED_SELECTION')">
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SELECTION', 'RADIUS')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SELECTION')" :name="'RADIUS'" :icon="'glyphicons-target'" :values="[3, 6, 12, 18, 24, 48]" :tooltip="'Detection radius'" :cls="'w-50'"></indigo-edit-number>
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SELECTION', 'SUBFRAME')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SELECTION')" :name="'SUBFRAME'" :icon="'glyphicons-crop'" :values="[{ label: 'Off', value: 0 }, 1, 2, 3, 4, 5]" :tooltip="'Automatic subframing'" :cls="'w-50'"></indigo-edit-number>
										</template>
									</div>
								</div>
							</template>
							<template v-if="findProperty('Guider Agent', 'AGENT_GUIDER_CORRECTION_MODE_RA') != null">
								<div class="card p-1 m-1 mt-2 bg-light">
									<div class="card-body d-flex flex-wrap">
										<indigo-select-item :property="findProperty('Guider Agent', 'AGENT_GUIDER_CORRECTION_MODE_RA')" :label-prefix="'RA '"></indigo-select-item>
										<template v-if="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS') != null && window.guiderRaCorrectionModeIs('PI')">
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'AGGRESSIVITY_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'AGGRESSIVITY_RA'" :icon="'glyphicons-dashboard'" :tooltip="'RA aggressivity (%)'" :cls="'w-50'"></indigo-edit-number>
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'I_GAIN_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'I_GAIN_RA'" :icon="'glyphicons-refresh'" :tooltip="'RA integral gain'" :cls="'w-50'"></indigo-edit-number>
										</template>
										<template v-if="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS') != null && window.guiderRaCorrectionModeIs('HYSTERESIS')">
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'HYSTERESIS_AGGRESSIVENESS_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'HYSTERESIS_AGGRESSIVENESS_RA'" :icon="'glyphicons-dashboard'" :tooltip="'RA aggressivity (%)'" :cls="'w-50'"></indigo-edit-number>
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'HYSTERESIS_HYSTERESIS_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'HYSTERESIS_HYSTERESIS_RA'" :icon="'glyphicons-history'" :tooltip="'RA hysteresis (%)'" :cls="'w-50'"></indigo-edit-number>
										</template>
										<template v-if="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS') != null && window.guiderRaCorrectionModeIs('LINEAR_TREND')">
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'LINEAR_TREND_AGGRESSIVENESS_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'LINEAR_TREND_AGGRESSIVENESS_RA'" :icon="'glyphicons-dashboard'" :tooltip="'RA aggressivity (%)'" :cls="'w-50'"></indigo-edit-number>
										</template>
										<template v-if="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS') != null && window.guiderRaCorrectionModeIs('PPEC')">
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'PPEC_REACTIVE_GAIN_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'PPEC_REACTIVE_GAIN_RA'" :icon="'glyphicons-dashboard'" :tooltip="'RA PPEC reactive gain (%)'" :cls="'w-50'"></indigo-edit-number>
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'PPEC_PREDICTION_GAIN_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'PPEC_PREDICTION_GAIN_RA'" :icon="'glyphicons-signal'" :tooltip="'RA PPEC predictive gain (%)'" :cls="'w-50'"></indigo-edit-number>
											<indigo-edit-number v-if="window.guiderPropertyHasItem('AGENT_GUIDER_SETTINGS', 'PPEC_PERIOD_RA')" :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'PPEC_PERIOD_RA'" :icon="'glyphicons-stopwatch'" :tooltip="'RA PPEC period (s)'" :cls="'w-50'"></indigo-edit-number>
										</template>
									</div>
								</div>
							</template>
							<template v-if="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS') != null">
								<div class="card p-1 m-1 mt-2 bg-light">
									<div class="card-body d-flex flex-wrap">
										<indigo-edit-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'AGGRESSIVITY_DEC'" :icon="'glyphicons-option-horizontal'" :tooltip="'Aggressivity Dec'"></indigo-edit-number>
										<indigo-edit-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'STEP0'" :icon="'glyphicons-hourglass'" :values="[0.01, 0.05, 0.1, 0.2, 0.5, 1]" :tooltip="'Calibration Step'"></indigo-edit-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'SPEED_RA'" :icon="'px/s α'" :tooltip="'Right Ascension Speed'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'SPEED_DEC'" :icon="'px/s δ'" :tooltip="'Declination Speed'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'BACKLASH'" :icon="'b-lash'" :tooltip="'Backlash'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_SETTINGS')" :name="'ANGLE'" :icon="'angle'" :tooltip="'Angle'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'PHASE'" :icon="'phase'" :tooltip="'Calibration Phase'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'FRAME'" :icon="'frame'" :tooltip="'Frame Count'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'RMSE_RA'" :icon="'err α'" :tooltip="'Right Ascension RMSE'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'RMSE_DEC'" :icon="'err δ'" :tooltip="'Declination RMSE'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'DRIFT_RA'" :icon="'drft α'" :tooltip="'Right Ascension Drift'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'DRIFT_DEC'" :icon="'drft δ'" :tooltip="'Declination Drift'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'CORR_RA'" :icon="'cor α'" :tooltip="'Right Ascension Correction'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'CORR_DEC'" :icon="'cor δ'" :tooltip="'Declination Correction'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'DELAY'" :icon="'delay'" :tooltip="'Delay between frames'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'SNR'" :icon="'S/N'" :tooltip="'Signal/noise ratio'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'DITHERING'" :icon="'dithering'" :tooltip="'Dithering RMSE'"></indigo-show-number>
										<indigo-show-number :property="findProperty('Guider Agent', 'AGENT_GUIDER_STATS')" :name="'PHASE'" :icon="'phase'" :tooltip="'Calibration phase'"></indigo-show-number>
										<div v-if="findProperty('Guider Agent', 'AGENT_START_PROCESS') != null" class="d-flex p-1 w-100 indigo-command-row">
											<indigo-status-button :property="findProperty('Guider Agent', 'AGENT_START_PROCESS')" busy-item="PREVIEW_1" :status-class="window.guiderStartProcessButtonClass('PREVIEW_1')" :disabled="window.guiderStartProcessButtonDisabled('PREVIEW_1')" :action="window.guiderPreview1" data-bs-toggle="tooltip" title="Single image preview">
												<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
													<path d="M25,8H22.125L21.81,6.91992A2.83342,2.83342,0,0,0,19.25,5h-6.5a2.83342,2.83342,0,0,0-2.56,1.91992L9.875,8H7a3.00879,3.00879,0,0,0-3,3V23a3.00879,3.00879,0,0,0,3,3H25a3.00879,3.00879,0,0,0,3-3V11A3.00879,3.00879,0,0,0,25,8ZM16,23a6,6,0,1,1,6-6A6,6,0,0,1,16,23ZM26,11.5a.5.5,0,0,1-.5.5h-1a.5.5,0,0,1-.5-.5v-1a.5.5,0,0,1,.5-.5h1a.5.5,0,0,1,.5.5ZM20,17a4,4,0,1,1-4-4A3.99992,3.99992,0,0,1,20,17Z"/>
												</svg>
											</indigo-status-button>
											<indigo-status-button :property="findProperty('Guider Agent', 'AGENT_START_PROCESS')" busy-item="PREVIEW" :status-class="window.guiderStartProcessButtonClass('PREVIEW')" :disabled="window.guiderStartProcessButtonDisabled('PREVIEW')" :action="window.guiderPreview" data-bs-toggle="tooltip" title="Preview">
												<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
													<path d="M31,11v9a1,1,0,0,1-1,1H29l-5-3.43748v-4.125L29,10h1A1,1,0,0,1,31,11ZM20,8H6a2.00591,2.00591,0,0,0-2,2V21a2.00591,2.00591,0,0,0,2,2H20a2.00591,2.00591,0,0,0,2-2V10A2.00591,2.00591,0,0,0,20,8Z"/>
												</svg>
											</indigo-status-button>
											<indigo-status-button :property="findProperty('Guider Agent', 'AGENT_START_PROCESS')" busy-item="CALIBRATION" :status-class="window.guiderStartProcessButtonClass('CALIBRATION')" :disabled="window.guiderStartProcessButtonDisabled('CALIBRATION')" :action="window.calibrate" data-bs-toggle="tooltip" title="Calibrate">
												<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
													<path d="M7,12V9A1,1,0,0,1,8,8H9v5H8A1,1,0,0,1,7,12Zm5,3.92065a1,1,0,0,0-1.57349-.81927L3.88464,19.68073a1,1,0,0,0,0,1.63848l6.54187,4.57935A1,1,0,0,0,12,25.07928V23h5V18H12ZM13,8H11v5h2ZM24,18H23v5h1a1,1,0,0,0,1-1V19A1,1,0,0,0,24,18Zm4.11536-8.31927L21.57349,5.10138A1,1,0,0,0,20,5.92065V8H15v5h5v2.07928a1,1,0,0,0,1.57349.81928l6.54187-4.57935A1,1,0,0,0,28.11536,9.68073ZM19,23h2V18H19Z"/>
												</svg>
											</indigo-status-button>
											<indigo-status-button :property="findProperty('Guider Agent', 'AGENT_START_PROCESS')" busy-item="GUIDING" :status-class="window.guiderStartProcessButtonClass('GUIDING')" :disabled="window.guiderStartProcessButtonDisabled('GUIDING')" :action="window.guide" class="me-auto" data-bs-toggle="tooltip" title="Guide">
												<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
													<path d="M28,19v1a1,1,0,0,1-1,1H22.50018a1.5002,1.5002,0,0,1-1.47674-1.23633L19.95215,13.7666,17.47363,26.78076a1.49992,1.49992,0,0,1-1.40625,1.21778c-.02246.001-.04492.00146-.06836.00146a1.50033,1.50033,0,0,1-1.4414-1.08789L12,17.96l-.55756,1.95191A1.50018,1.50018,0,0,1,10,21H5a1,1,0,0,1-1-1V19a1,1,0,0,1,1-1H8.86816l1.68946-5.91211a1.50014,1.50014,0,0,1,2.88476,0l2.26563,7.9292L18.52637,5.21924a1.5,1.5,0,0,1,2.95019.01709L23.75586,18H27A1,1,0,0,1,28,19Z"/>
												</svg>
											</indigo-status-button>
											<button class="btn btn-svg idle-state" onclick="stop()" data-bs-toggle="tooltip" title="Stop">
												<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
													<path d="M25,8V24a1,1,0,0,1-1,1H8a1,1,0,0,1-1-1V8A1,1,0,0,1,8,7H24A1,1,0,0,1,25,8Z"/>
												</svg>
											</button>
										</div>
									</div>
								</div>
							</template>
						</div>
						<div class="col-xl-8">
							<div id="image_container" class="card p-1 m-1 bg-light" style="min-height: 10rem">
								<div class="card-body">
									<div class="card p-0 border-0 position-relative" style="display: none">
										<img id="image" class="img-fluid rounded"/>
										<indigo-star-selection-overlay :selection-property="findProperty('Guider Agent', 'AGENT_GUIDER_SELECTION')" :marker-count="window.guiderStarSelectionMarkerCount()" :camera-selected="window.guiderCameraSelected() && (window.guiderDetectionModeIs('SELECTION') || window.guiderDetectionModeIs('WEIGHTED_SELECTION'))"></indigo-star-selection-overlay>
										<img id="histogram" class="indigo-preview-histogram" width="256" height="128" style="display:none"/>
										<indigo-guider-graph v-if="window.guiderGraphsVisible()" ref="graph"></indigo-guider-graph>
									</div>
								</div>
							</div>
						</div>
					</div>
				</template>
				<indigo-status-bar></indigo-status-bar>
			</div>
		</div>
	</body>
	<script src="jquery.min.js"></script>
	<script src="bootstrap.min.js"></script>
	<script src="vue.global.prod.js"></script>
	<script src="indigo.js"></script>
	<script src="components.js"></script>
	<script>
		
		indigoURL = new URL((window.location.protocol == "https:" ? "wss://" : "ws://") + window.location.host);
		guiSetup();
		window.addEventListener("load", init, false);
		
		function checkState() {
			var server = INDIGO.devices["Server"];
			if (server == null) {
				console.log("No 'Server' device.");
			} else {
				var hostTime = INDIGO.devices["Server"]["HOST_TIME"];
				if (hostTime != null && hostTime.items[0].value == "") {
					changeProperty("Server", "HOST_TIME", { "TIME": timestamp() })
				}
				if (INDIGO.devices["Guider Agent"] == null) {
					console.log("No 'Guider Agent' device.");
					if (server["DRIVERS"].item("indigo_agent_guider") == null) {
						console.log("Trying to load 'indigo_agent_guider' driver.");
						changeProperty("Server", "LOAD", { "DRIVER": "indigo_agent_guider" });
					} else if (!server["DRIVERS"].item("indigo_agent_guider").value) {
						console.log("Trying to enable 'indigo_agent_guider' driver.");
						changeProperty("Server", "DRIVERS", { "indigo_agent_guider": true });
					}
				}
			}
		}
	
		var targetExposureTime = 0;
		var guiderStartProcessItem = null;

		function guiderStartProcessProperty() {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return null;
			return INDIGO.devices["Guider Agent"]["AGENT_START_PROCESS"];
		}

		function guiderStartProcessSelectedItem() {
			var property = guiderStartProcessProperty();
			if (property != null) {
				for (var i in property.items) {
					if (property.items[i].value)
						return property.items[i].name;
				}
			}
			return guiderStartProcessItem;
		}

		function guiderStartProcessBusy() {
			var property = guiderStartProcessProperty();
			return property != null && property.state == "Busy";
		}

		function guiderStartProcessButtonClass(itemName) {
			var property = guiderStartProcessProperty();
			if (property == null || guiderStartProcessSelectedItem() != itemName)
				return "idle-state";
			if (property.state == "Busy")
				return "busy-state";
			if (property.state == "Alert")
				return "alert-state";
			return "idle-state";
		}

		function guiderStartProcessButtonDisabled(itemName) {
			return guiderStartProcessBusy();
		}

		function guiderSetGraphsForStartProcessItem(itemName) {
			if (INDIGO == null)
				return;
			if (itemName == "PREVIEW_1" || itemName == "PREVIEW")
				INDIGO.guiderGraphsEnabled = false;
			else if (itemName == "CALIBRATION" || itemName == "GUIDING")
				INDIGO.guiderGraphsEnabled = true;
		}

		function guiderSetStartProcessItem(itemName) {
			guiderStartProcessItem = itemName;
			guiderSetGraphsForStartProcessItem(itemName);
		}

		function guiderCameraSelected() {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return false;
			var property = INDIGO.devices["Guider Agent"]["FILTER_CCD_LIST"];
			return property != null && property.items.length > 0 && !property.items[0].value;
		}

		function guiderGuiderSelected() {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return false;
			var property = INDIGO.devices["Guider Agent"]["FILTER_GUIDER_LIST"];
			return property != null && property.items.length > 0 && !property.items[0].value;
		}

		function guiderSelectedGuider() {
			if (!guiderGuiderSelected())
				return null;
			var property = INDIGO.devices["Guider Agent"]["FILTER_GUIDER_LIST"];
			for (var i in property.items) {
				if (property.items[i].value)
					return property.items[i].name;
			}
			return null;
		}

		function guiderRateProperty() {
			var guider = guiderSelectedGuider();
			if (guider == null || INDIGO.devices[guider] == null)
				return null;
			return INDIGO.devices[guider]["GUIDER_RATE"];
		}

		function guiderRateItem(name) {
			var property = guiderRateProperty();
			if (property == null)
				return null;
			return property.item(name);
		}

		function guiderRateHasDecItem() {
			return guiderRateItem("DEC_RATE") != null;
		}

		function guiderRateValue(name) {
			var item = guiderRateItem(name);
			if (item == null)
				return null;
			return item.target != null ? item.target : item.value;
		}

		function guiderGraphsVisible() {
			return INDIGO != null && INDIGO.guiderGraphsEnabled && guiderCameraSelected();
		}

		function guiderSelectedCamera() {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return null;
			var property = INDIGO.devices["Guider Agent"]["FILTER_CCD_LIST"];
			if (property == null)
				return null;
			for (var i in property.items) {
				if (property.items[i].value)
					return property.items[i].name;
			}
			return null;
		}

		function guiderDetectionModeIs(name) {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return false;
			var property = INDIGO.devices["Guider Agent"]["AGENT_GUIDER_DETECTION_MODE"];
			if (property == null)
				return false;
			var item = property.item(name);
			return item != null && item.value;
		}

		function guiderRaCorrectionModeIs(name) {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return false;
			var property = INDIGO.devices["Guider Agent"]["AGENT_GUIDER_CORRECTION_MODE_RA"];
			if (property == null)
				return false;
			var item = property.item(name);
			if (item == null && name == "PI")
				item = property.item("PI_CONTROLLER");
			return item != null && item.value;
		}

		function guiderPropertyHasItem(propertyName, itemName) {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return false;
			var property = INDIGO.devices["Guider Agent"][propertyName];
			return property != null && property.item(itemName) != null;
		}

		function guiderSelectionCount() {
			if (INDIGO == null || INDIGO.devices["Guider Agent"] == null)
				return 1;
			var property = INDIGO.devices["Guider Agent"]["AGENT_GUIDER_SELECTION"];
			if (property == null)
				return 1;
			var item = property.item("COUNT");
			if (item == null || !isFinite(Number(item.value)) || Number(item.value) < 1)
				return 1;
			return Number(item.value);
		}

		function guiderStarSelectionMarkerCount() {
			if (guiderDetectionModeIs("SELECTION") || guiderDetectionModeIs("WEIGHTED_SELECTION"))
				return guiderSelectionCount();
			return 0;
		}

		function guiderPreviewURL(value) {
			if (value.startsWith("http://") || value.startsWith("https://"))
				return value;
			return window.location.protocol + "//" + INDIGO.host + value;
		}

		function guiderShowPreviewElement(selector, value) {
			if (value == null)
				return;
			$(selector).attr("src", guiderPreviewURL(value) + '?' + new Date().getTime()).show().parent().show();
		}

		function onDefineProperty(property) {
			onUpdateProperty(property);
		}

		function onUpdateProperty(property) {
			if (property.name == "CCD_PREVIEW_IMAGE" && property.device == guiderSelectedCamera()) {
				if (property.state == "Ok")
					guiderShowPreviewElement("#image", property.item("IMAGE").value);
			} else if (property.name == "CCD_PREVIEW_HISTOGRAM" && property.device == guiderSelectedCamera()) {
				if (property.state == "Ok")
					guiderShowPreviewElement("#histogram", property.item("IMAGE").value);
			}
			if (property.device == "Guider Agent") {
				if (property.name == "AGENT_START_PROCESS") {
					guiderSetGraphsForStartProcessItem(guiderStartProcessSelectedItem());
					if (property.state != "Busy") {
						guiderStartProcessItem = null;
					}
				} else if (property.name == "AGENT_GUIDER_STATS") {
					var phase = property.item("PHASE").value;
					var frame = property.item("FRAME").value;
					var graph = INDIGO.$refs.graph;
					if (graph != null) {
						if (frame <= 1) {
							graph.clear();
						}
						var driftRa;
						var driftDec;
						var driftUnit;
						if (phase > 0) {
							driftRa = property.item("DRIFT_X").value;
							driftDec = property.item("DRIFT_Y").value;
							driftUnit = "px";
						} else {
							driftRa = property.item("DRIFT_RA").value;
							driftDec = property.item("DRIFT_DEC").value;
							driftUnit = '"';
						}
						graph.push(driftRa, driftDec, property.item("CORR_RA").value, property.item("CORR_DEC").value, property.item("DITHERING").value, driftUnit);
					}
				}
			}
			guiSetup();
		}

		function onDeleteProperty(property) {
			if (typeof property === 'undefined' || property.name == "CCD_PREVIEW_HISTOGRAM") {
				$("#histogram").hide();
			}
			guiSetup();
		}
	
		function guiderPreview1() {
			guiderSetStartProcessItem("PREVIEW_1");
			changeProperty("Guider Agent", "CCD_PREVIEW", { "ENABLED_WITH_HISTOGRAM": true });
			changeProperty("Guider Agent", "AGENT_START_PROCESS", { "PREVIEW_1": true });
		}

		function guiderPreview() {
			guiderSetStartProcessItem("PREVIEW");
			changeProperty("Guider Agent", "CCD_PREVIEW", { "ENABLED_WITH_HISTOGRAM": true });
			changeProperty("Guider Agent", "AGENT_START_PROCESS", { "PREVIEW": true });
		}

		function calibrate() {
			guiderSetStartProcessItem("CALIBRATION");
			changeProperty("Guider Agent", "CCD_PREVIEW", { "ENABLED_WITH_HISTOGRAM": true });
			changeProperty("Guider Agent", "AGENT_START_PROCESS", { "CALIBRATION" : true });
		}

		function guide() {
			guiderSetStartProcessItem("GUIDING");
			changeProperty("Guider Agent", "CCD_PREVIEW", { "ENABLED_WITH_HISTOGRAM": true });
			changeProperty("Guider Agent", "AGENT_START_PROCESS", { "GUIDING" : true });
		}
	
		function stop() {
			changeProperty("Guider Agent", "AGENT_ABORT_PROCESS", { "ABORT": true });
		}
	
	</script>
</html>
