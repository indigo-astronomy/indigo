<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
			<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
			<link rel="stylesheet" href="bootstrap.min.css"/>
			<link rel="stylesheet" href="glyphicons.css"/>
			<link rel="stylesheet" href="indigo.css"/>
		</head>
	<title>INDIGO Script</title>
	<body class="bg-secondary">
		<div id="ROOT">
			<indigo-navbar active="script" title="INDIGO Script" icon="script.png" expand="md"></indigo-navbar>
			<div class="container-fluid">
				<div v-if="devices['Scripting Agent'] == null" class="alert alert-warning alert-dismissible m-1" role="alert">
					Waiting for Scripting agent...
				</div>
				<template v-else>
					<div class="row g-0">
						<div class="col-xl-4 indigo-side-panel">
							<div class="card p-1 m-1 bg-light">
								<div class="d-flex flex-wrap gap-1 m-1 p-1 indigo-command-row">
										<button type="button" class="btn btn-svg idle-state" data-bs-toggle="tooltip" title="Create new script" aria-label="Create new script" @click="newScript()">
											<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
												<path d="M18,6H14v8H6v4h8v8h4V18h8V14H18Z"/>
											</svg>
										</button>
										<button type="button" class="btn btn-svg idle-state" :disabled="selectedProperty == null || scriptDirty" data-bs-toggle="tooltip" title="Delete script" aria-label="Delete script" @click="deleteScript()">
											<span class="glyphicons glyphicons-bin" aria-hidden="true"></span>
										</button>
										<button type="button" class="btn btn-svg idle-state" :disabled="!scriptDirty || scriptSaveProperty() == null" data-bs-toggle="tooltip" :title="selectedProperty == null ? 'Save new script' : 'Save script name and text'" :aria-label="selectedProperty == null ? 'Save new script' : 'Save script name and text'" @click="saveScript()">
											<span class="glyphicons glyphicons-folder-open" aria-hidden="true"></span>
										</button>
										<button type="button" class="btn btn-svg" :class="scriptOnLoadActive(selectedProperty) ? 'ok-state' : 'idle-state'" :disabled="selectedProperty == null || findProperty('Scripting Agent', 'AGENT_SCRIPTING_ON_LOAD_SCRIPT') == null" data-bs-toggle="tooltip" title="Execute script on agent load" aria-label="Execute script on agent load" @click="toggleScriptOnLoad(selectedProperty)">
											<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
												<path d="M22.99933,9.46185V22.53821a.8.8,0,0,1-1.2312.67383L11.55219,16.67383a.8.8,0,0,1,0-1.34766L21.76813,8.788A.8.8,0,0,1,22.99933,9.46185ZM10,8H9A1,1,0,0,0,8,9V23a1,1,0,0,0,1,1h1a1,1,0,0,0,1-1V9A1,1,0,0,0,10,8Z"/>
											</svg>
										</button>
										<button type="button" class="btn btn-svg" :class="scriptOnUnloadActive(selectedProperty) ? 'ok-state' : 'idle-state'" :disabled="selectedProperty == null || findProperty('Scripting Agent', 'AGENT_SCRIPTING_ON_UNLOAD_SCRIPT') == null" data-bs-toggle="tooltip" title="Execute script on agent unload" aria-label="Execute script on agent unload" @click="toggleScriptOnUnload(selectedProperty)">
											<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
												<path d="M20.44781,15.32617a.8.8,0,0,1,0,1.34766L10.23187,23.212a.8.8,0,0,1-1.2312-.67383V9.46185a.8.8,0,0,1,1.2312-.67383ZM23,8H22a1,1,0,0,0-1,1V23a1,1,0,0,0,1,1h1a1,1,0,0,0,1-1V9A1,1,0,0,0,23,8Z"/>
											</svg>
										</button>
										<button type="button" class="btn btn-svg idle-state ms-auto" :disabled="selectedProperty == null || scriptDirty" data-bs-toggle="tooltip" title="Execute script" aria-label="Execute script" @click="executeScript()">
											<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
												<path d="M9,5V27L25,16Z"/>
											</svg>
										</button>
								</div>
								<div class="list-group indigo-script-list m-1 p-1 overflow-auto" style="max-height: calc(100vh - 170px)">
									<template v-for="property in scriptsProperties()" :key="property.name">
											<button v-if="property.name!='AGENT_SCRIPTING_ADD_SCRIPT'" type="button" class="list-group-item list-group-item-action" :class="property == selectedProperty ? 'ctrl-tree-selected' : ''" @click="selectScript(property)">
												{{ property == selectedProperty && scriptDirty ? '* ' : '' }}{{ property.label }}
											</button>
									</template>
								</div>
							</div>
						</div>
						<div class="col-xl-8">
							<div class="card p-1 m-1 bg-light">
								<form class="m-0">
									<indigo-script-editor ref="scriptEditor" :property="selectedProperty" @change="scriptChanged()"></indigo-script-editor>
								</form>
							</div>
						</div>
					</div>
				</template>
				<indigo-status-bar></indigo-status-bar>
			</div>
		</div>
	</body>
	<script src="jquery.min.js"></script>
	<script src="bootstrap.min.js"></script>
	<script src="vue.global.prod.js"></script>
	<script src="indigo.js"></script>
	<script src="components.js"></script>
	<script>
		
		indigoURL = new URL((window.location.protocol == "https:" ? "wss://" : "ws://") + window.location.host);
		guiSetup();
		window.addEventListener("load", init, false);
		
		function checkState() {
			var server = INDIGO.devices["Server"];
			if (server == null) {
				console.log("No 'Server' device.");
			} else {
				var hostTime = INDIGO.devices["Server"]["HOST_TIME"];
				if (hostTime != null && hostTime.items[0].value == "") {
					changeProperty("Server", "HOST_TIME", { "TIME": timestamp() })
				}
				if (INDIGO.devices["Scripting Agent"] == null) {
					console.log("No 'Scripting Agent' device.");
					if (server["DRIVERS"].item("indigo_agent_scripting") == null) {
						console.log("Trying to load 'indigo_agent_scripting' driver.");
						changeProperty("Server", "LOAD", { "DRIVER": "indigo_agent_scripting" });
					} else if (!server["DRIVERS"].item("indigo_agent_scripting").value) {
						console.log("Trying to enable 'indigo_agent_scripting' driver.");
						changeProperty("Server", "DRIVERS", { "indigo_agent_scripting": true });
					}
				}
			}
		}
	
			function onDefineProperty(property) {
				INDIGO.scriptDefined(property);
				onUpdateProperty(property);
			}

		function onUpdateProperty(property) {
			guiSetup();
		}
	
		function onDeleteProperty(property) {
			guiSetup();
		}
	
		</script>
	</html>
