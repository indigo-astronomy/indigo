<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
		<link rel="stylesheet" href="bootstrap.min.css"/>
		<link rel="stylesheet" href="indigo.css"/>
	</head>
	<title>INDIGO Control Panel</title>
	<body class="bg-secondary">
		<div id="ROOT">
			<indigo-navbar active="ctrl" title="Control Panel" icon="ctrl.png"></indigo-navbar>
			<div class="container-fluid">
				<div v-if="devices['Server'] == null" class="alert alert-warning alert-dismissible m-1" role="alert">
					Waiting for server...
				</div>
				<template v-else>
					<div class="row">
						<div class="col-sm-12">
							<div class="card p-1 m-1 bg-light">
								<indigo-ctrl :devices="devices"></indigo-ctrl>
							</div>
						</div>
					</div>
				</template>
				<div v-show="connected" class="alert alert-success alert-dismissible fade show m-1 mt-2" role="alert">
					{{ state }}
					<span v-if="findProperty('Server', 'INFO')" class="float-end">
						INDIGO Server {{findProperty('Server', 'INFO').item('VERSION').value}} at {{findProperty('Server', 'INFO').item('SERVICE').value}}
					</span>
				</div>
				<div v-show="failed" class="alert alert-danger alert-dismissible fade show m-1 mt-2" role="alert">
					{{ state }}
				</div>
				<div class="alert alert-info show m-1 mt-2" role="alert">
					Copyright &copy; 2019-2025, The INDIGO Initiative. All rights reserved.
					<a v-if="dark" href="#" class="float-end" onclick="setLightMode()">Switch to light appearance</a>
					<a v-else href="#" class="float-end" onclick="setDarkMode()">Switch to dark appearance</a>
				</div>
			</div>
		</div>
	</body>
	<script src="jquery.min.js"></script>
	<script src="bootstrap.min.js"></script>
	<script src="vue.global.prod.js"></script>
	<script src="indigo.js"></script>
	<script src="components.js"></script>
	<script language="javascript" type="text/javascript">
		
		indigoURL = new URL((window.location.protocol == "https:" ? "wss://" : "ws://") + window.location.host);
		guiSetup();
		window.addEventListener("load", init, false);

		function checkState() {
			if (INDIGO.devices["Server"] == null) {
				console.log("No 'Server' device.");
			} else {
				var hostTime = INDIGO.devices["Server"]["HOST_TIME"];
				if (hostTime != null && hostTime.items[0].value == "") {
					changeProperty("Server", "HOST_TIME", { "TIME": timestamp() })
				}
			}
		}
	
		function onDefineProperty(property) {
			guiSetup();
		}
	
		function onUpdateProperty(property) {
			guiSetup();
		}
	
		function onDeleteProperty(property) {
			guiSetup();
		}
	
	</script>
</html>
